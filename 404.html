<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Página não encontrada — X-Marçal Técnico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    * {
      line-height: 1.5;
      margin: 0;
      box-sizing: border-box;
    }

    html {
      color: #e0e6ed;
      background: #121824;
      display: table;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100%;
      text-align: center;
      width: 100%;
    }

    body {
      display: table-cell;
      vertical-align: middle;
      margin: 2em auto;
      padding: 0 16px;
    }

    h1 {
      color: #ffffff;
      font-size: 2em;
      font-weight: 700;
      margin-bottom: 0.5em;
    }

    p {
      margin: 0 auto 1.5em;
      max-width: 360px;
      color: #8a99ad;
    }

    a {
      display: inline-block;
      color: #ffffff;
      background: #0066cc;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <h1>Página não encontrada</h1>
  <p>Desculpe, mas a página que você procura não existe ou foi movida.</p>
  <a href="/">Voltar para o início</a>
</body>

</html>
